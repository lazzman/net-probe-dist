# Publish probe export packages to GitHub Release (not git tree)
name: publish-dist

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      workers:
        description: "Parallel probe workers (16-32 typical on GHA)"
        required: false
        default: "24"
      skip_live:
        description: "Export only (skip live probes) true/false"
        required: false
        default: "false"

# 同一时刻只允许一个发布 run；不取消进行中的全量探测，避免白跑
concurrency:
  group: publish-dist
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime
        run: |
          set -euo pipefail
          VER="1.13.15"
          curl -fsSL -o /tmp/rt.tgz \
            "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-linux-amd64.tar.gz"
          tar -xzf /tmp/rt.tgz -C /tmp
          sudo install -m 755 "/tmp/sing-box-${VER}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Build probe exports
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          WORKERS="${{ github.event.inputs.workers || '24' }}"
          SKIP="${{ github.event.inputs.skip_live || 'false' }}"
          EXTRA=()
          if [ "$SKIP" = "true" ]; then EXTRA+=(--skip-live); fi
          python3 scripts/ci_public_sub_pipeline.py --workspace . --workers "$WORKERS" "${EXTRA[@]}"
          test -f dist/fsl64
          test -f dist/fslyaml
          test -f dist/fslsb
          test -f dist/fslyamlcomp
          ls -lh dist/

      - name: Publish assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="dist"
          # 统一上海时间展示
          TS="$(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S%z)"
          TS_HUMAN="$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S CST')"
          NOTES_FILE="$(mktemp)"
          {
            echo "Automated reachability probe export packages."
            echo
            echo "- Updated (Asia/Shanghai): **${TS_HUMAN}**"
            echo "- Updated (ISO+08): `${TS}`"
            echo "- Tag: \`${TAG}\` (assets overwritten each run)"
            echo "- Run: ${{ github.run_id }}"
            echo
            if [ -f STATUS.json ]; then
              echo "### STATUS"
              echo '```json'
              cat STATUS.json
              echo '```'
            fi
            if [ -f dist/manifest.json ]; then
              echo
              echo "### manifest (summary)"
              echo '```json'
              python3 -c 'import json; m=json.load(open("dist/manifest.json", encoding="utf-8")); keys=("generated_at","share_link_count","clash_proxy_count","by_protocol","formats"); print(json.dumps({k:m.get(k) for k in keys}, ensure_ascii=False, indent=2))'
              echo '```'
            fi
            echo
            echo "### Download"
            echo "- https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/fsl64"
            echo "- https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/fslyaml"
            echo "- https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/fslsb"
            echo "- https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/fslyamlcomp"
            echo "- https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/manifest.json"
          } > "$NOTES_FILE"

          ASSETS=(dist/fsl64 dist/fslyaml dist/fslsb dist/fslyamlcomp)
          [ -f dist/manifest.json ] && ASSETS+=(dist/manifest.json)
          [ -f dist/outbounds.json ] && ASSETS+=(dist/outbounds.json)
          [ -f dist/splits.json ] && ASSETS+=(dist/splits.json)
          [ -f dist/SPLITS.md ] && ASSETS+=(dist/SPLITS.md)
          [ -f dist/ip-cache.json ] && ASSETS+=(dist/ip-cache.json)
          # 按国家/类型拆分的 flat 订阅
          while IFS= read -r -d '' f; do ASSETS+=("$f"); done < <(find dist -maxdepth 1 -type f \( -name 'geo-*-fsl*' -o -name 'type-*-fsl*' \) -print0 2>/dev/null || true)

          # 固定 tag=dist，每次覆盖资源。
          # 注意：gh release edit 的 --latest 是布尔 flag，不能写成 --latest true。
          # 上传与 notes 分开；诊断命令只读合法 JSON 字段，避免把成功发布标成失败。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --notes-file "$NOTES_FILE" --title "Probe export packages"
            gh release edit "$TAG" --latest || echo "warn: mark --latest skipped/failed (assets already uploaded)"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "Probe export packages" \
              --notes-file "$NOTES_FILE" \
              --latest
          fi
          echo "Release published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          # 可用字段：tagName/name/publishedAt/isDraft/assets（无 isLatest/updatedAt）
          gh release view "$TAG" --json tagName,name,publishedAt,isDraft,assets \
            --jq '{tag:.tagName,name,publishedAt,isDraft,assets:[.assets[].name]}'

      - name: Refresh README status + commit pointers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 用本轮 STATUS / manifest 重写 README（更新时间 + worker 状态）
          python3 scripts/render_readme.py --workspace .

          # 只提交轻量指针文件（不提交 dist 大包）
          git add README.md dist/README.md STATUS.json 2>/dev/null || true
          git rm -r --cached --ignore-unmatch \
            dist/fsl64 dist/fslyaml dist/fslsb dist/fslyamlcomp dist/manifest.json \
            nodes analysis/findings/_public_sub_nodes.json 2>/dev/null || true

          echo "==== staged ===="
          git diff --cached --stat || true
          if git diff --cached --quiet; then
            echo "No README/STATUS changes"
            git status -sb || true
            exit 0
          fi

          TS="$(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S%z)"
          RUN_ID="${{ github.run_id }}"
          git commit -m "chore(status): update README timestamp ${TS} (run ${RUN_ID})"

          # 并发保护：rebase 后重试 push，避免远程有新提交时直接失败
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed $(git rev-parse --short HEAD)"
              exit 0
            fi
            echo "push rejected (attempt $i), rebasing onto origin/main ..."
            git fetch origin main
            git rebase origin/main || {
              echo "rebase conflict; abort and keep local status commit"
              git rebase --abort || true
              exit 1
            }
            sleep 2
          done
          echo "push failed after retries"
          exit 1
