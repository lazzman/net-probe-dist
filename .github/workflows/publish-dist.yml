# Publish probe export packages to GitHub Release (not git tree)
name: publish-dist

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      workers:
        description: "Parallel probe workers (16-32 typical on GHA)"
        required: false
        default: "24"
      skip_live:
        description: "Export only (skip live probes) true/false"
        required: false
        default: "false"

concurrency:
  group: publish-dist
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime
        run: |
          set -euo pipefail
          VER="1.13.15"
          curl -fsSL -o /tmp/rt.tgz \
            "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-linux-amd64.tar.gz"
          tar -xzf /tmp/rt.tgz -C /tmp
          sudo install -m 755 "/tmp/sing-box-${VER}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Build probe exports
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          WORKERS="${{ github.event.inputs.workers || '24' }}"
          SKIP="${{ github.event.inputs.skip_live || 'false' }}"
          EXTRA=()
          if [ "$SKIP" = "true" ]; then EXTRA+=(--skip-live); fi
          python3 scripts/ci_public_sub_pipeline.py --workspace . --workers "$WORKERS" "${EXTRA[@]}"
          test -f dist/fsl64
          test -f dist/fslyaml
          test -f dist/fslsb
          test -f dist/fslyamlcomp
          ls -lh dist/

      - name: Publish assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="dist"
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          NOTES_FILE="$(mktemp)"
          {
            echo "Automated reachability probe export packages."
            echo
            echo "- Updated (UTC): **${TS}**"
            echo "- Tag: \`${TAG}\` (assets overwritten each run)"
            echo
            if [ -f STATUS.json ]; then
              echo "### STATUS"
              echo '```json'
              cat STATUS.json
              echo '```'
            fi
            if [ -f dist/manifest.json ]; then
              echo
              echo "### manifest (summary)"
              echo '```json'
              python3 -c 'import json; m=json.load(open("dist/manifest.json")); print(json.dumps({k:m.get(k) for k in ("generated_at","share_link_count","clash_proxy_count","by_protocol","formats") if k in m or True}, ensure_ascii=False, indent=2))'
              echo '```'
            fi
            echo
            echo "### Download"
            echo "- https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/fsl64"
            echo "- https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/fslyaml"
            echo "- https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/fslsb"
            echo "- https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/fslyamlcomp"
          } > "$NOTES_FILE"

          ASSETS=(dist/fsl64 dist/fslyaml dist/fslsb dist/fslyamlcomp)
          [ -f dist/manifest.json ] && ASSETS+=(dist/manifest.json)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --notes-file "$NOTES_FILE" --latest true --title "Probe export packages"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "Probe export packages" \
              --notes-file "$NOTES_FILE" \
              --latest
          fi
          echo "Release published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: Commit lightweight STATUS only (no dist binaries)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # README 链接是稳定 latest/download，一般无需每次改；只提交 STATUS.json
          if [ -f STATUS.json ]; then
            git add STATUS.json
          fi
          # 确保 dist 大文件未被跟踪
          git rm -r --cached --ignore-unmatch dist/fsl64 dist/fslyaml dist/fslsb dist/fslyamlcomp dist/manifest.json nodes 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No lightweight changes to commit"
            git status -sb || true
            exit 0
          fi
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git commit -m "chore(status): probe export ${TS}"
          git push origin HEAD:main
